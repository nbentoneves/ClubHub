name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn 4
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build